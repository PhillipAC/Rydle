<div class="green btn btn-success d-flex justify-content-center" (click)="copySummary()">Share</div>
<div class="d-flex justify-content-center success" *ngIf="showSuccess">Results copied</div>
<div class="blue d-flex justify-content-center">Related Wikipedia Pages</div>
<div class="blue d-flex justify-content-center" *ngFor="let page of eventPages">
    <a class="blue btn btn-info d-flex justify-content-center" href="{{page.Url}}">{{page.Title}}</a>
</div>
